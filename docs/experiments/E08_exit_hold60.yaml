id: E08
name: 確認：到期 60 天優於原本的 15 天（分批停利不變）
registered_at: 2026-11-12
status: adopted_monitoring    # 2026-11-12 經使用者核准已採用 60 天（champion-0c49884d59de）；本實驗持續驗證這個決定
type: alt_exit
direction: buy
track: exp15                  # 對照組：execution.EXIT_CHALLENGERS["exp15"]（原本的 15 天到期）
legacy_track: hold60          # 採用前產生的列（Champion＝15 天）以 hold60 為方案
hypothesis: >
  TP1／TP2／TP3 分批停利與移動保本規則完全不變，到期 60 個日曆天的逐筆淨 R 高於到期 15 天。
motivation: >
  出場方式研究（docs/research/EXIT_STUDY_2020_2026.md）：原本的出場有四到五成的單在 15 天到期時還沒走完。
  延長為 60 天後，全市場抽樣的成對差為 +0.161R（2020–2023）／+0.051R（2024–2026），臺灣 50 為
  +0.099R／+0.111R，四格的 95% 區間皆不含零；仍有 TP3 封頂，不靠極端值，勝率不降。
decision: >
  本實驗原登錄為「先驗證、再決定」。同日向使用者說明兩個選項的差別後，使用者決定直接採用 60 天。
  已知限制照實記錄：全市場抽樣在 2025、2026 兩年的成對差接近零；平均持有由約 11 天變為約 19～23 天；
  這不是事前判定規則選中的方案。因此實驗不撤銷，改為持續監測：若樣本外顯示 60 天並未較好，
  判定會是 not_supported，並應向使用者提出是否改回。
data_collection: >
  2026-11-13 起的候選（expire_days = 60）：Champion 淨 R 即 60 天的結果，另以 exp15 重算同一筆的 15 天結果。
  此前的候選（Champion＝15 天）：以 hold60 重算 60 天結果。兩種列都換算成「60 天 − 15 天」的成對差。
  已發出的訊號與已存在的影子列維持當時的 15 天，不在半途改定義。
primary_endpoint: 逐筆成對差（到期 60 天的淨 R − 到期 15 天的淨 R）的平均
robustness_endpoint: 每筆截在 ±3R 後的成對差平均（縮尾）
uncertainty: 以訊號日為叢集的拔靴，95% 信賴區間
exploratory_window: "<= 2026-11-12"
oos_window: ">= 2026-11-13"
min_oos_days: 40
min_oos_trades: 200
min_effect_r: 0.05
success_rule: OOS 成對差的 95% CI 下界 > 0.05R，且縮尾後成對差的 95% CI 下界 > 0
failure_rule: OOS 成對差的 95% CI 上界 < 0.05R（代表延長到期沒有實用改善，應提出是否改回）
caveats:
  - 60 天的結果最慢要兩個月才定案；累積到判定門檻可能需要四個月以上
  - 持有期變長會占用同時持倉名額，本實驗量的是每筆期望值，不是帳戶淨值
multiple_testing: 與 E01～E10 同屬一個 family（size = 10）
guardrails:
  - 只記錄與評估；程式不會自動改回或再調整到期天數
  - 不得在看到樣本外結果後修改門檻或方案；要改必須另立新編號
